<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071b30"/><text x="65" y="90" font-family="Arial" font-size="52" font-weight="bold" fill="#ffffff">ONE PAYMENT. THREE EMAILS.</text><text x="65" y="140" font-family="Arial" font-size="28" fill="#8dc9da">Why duplicate webhooks must not duplicate business actions</text><g font-family="Arial" font-size="25" fill="white" text-anchor="middle"><rect x="70" y="245" width="230" height="145" rx="18" fill="#15445a"/><text x="185" y="305">Customer</text><text x="185" y="350" fill="#f4c879">1 payment</text><rect x="355" y="245" width="230" height="145" rx="18" fill="#6c3448"/><text x="470" y="305">Webhook retry</text><text x="470" y="350" fill="#ffc5c5">3 deliveries</text><rect x="640" y="245" width="230" height="145" rx="18" fill="#126e68"/><text x="755" y="305">Inbox + Guard</text><text x="755" y="350">1 transition</text><rect x="925" y="245" width="215" height="145" rx="18" fill="#126e68"/><text x="1032" y="305">Outbox</text><text x="1032" y="350">1 intent</text></g><g fill="#f4c879"><path d="M315 300h28l-12 -10v20z"/><path d="M600 300h28l-12 -10v20z"/><path d="M885 300h28l-12 -10v20z"/></g><text x="65" y="505" font-family="Arial" font-size="34" fill="white">Inbox stops repeated delivery.</text><text x="65" y="555" font-family="Arial" font-size="34" fill="white">State guard stops repeated transitions.</text><text x="65" y="605" font-family="Arial" font-size="34" fill="white">Outbox makes follow-up actions recoverable.</text></svg>
