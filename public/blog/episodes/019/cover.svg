<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#061a12"/><circle cx="1080" cy="80" r="340" fill="#123b29"/><g font-family="Arial,sans-serif"><text x="55" y="65" font-size="22" fill="#d8bb69">ARCHITECTURE IN MOTION · EPISODE 019</text><text x="55" y="140" font-size="43" fill="#f5f1e5">Java Deadlocks and Thread Dumps:</text><text x="55" y="196" font-size="43" fill="#f5f1e5">Diagnosing Checkout That Stops Making</text><text x="55" y="252" font-size="43" fill="#f5f1e5">Progress</text><rect x="55" y="345" width="1090" height="190" rx="16" fill="#153c2a" stroke="#62724a"/><text x="80" y="390" font-size="24" fill="#d5dfd4">The checkout spinner never finishes while CPU stays low; two workers may</text><text x="80" y="422" font-size="24" fill="#d5dfd4">hold locks that each other needs.</text><text x="55" y="585" font-size="22" fill="#d8bb69">Real customer problem → inspect the failure → test the protection</text></g></svg>
