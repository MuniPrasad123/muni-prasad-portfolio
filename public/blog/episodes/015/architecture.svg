<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Payment webhook acceptance and dispatch boundaries</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8cddd0"/></marker></defs><rect width="1200" height="720" rx="16" fill="#0b1729"/><g font-family="Arial,sans-serif" fill="#eff5fb"><text x="50" y="55" font-size="25" fill="#efcf84">EPISODE 015 · ONE PAYMENT, RETRYABLE NOTIFICATIONS</text><g text-anchor="middle" font-size="23"><g fill="#17364b" stroke="#54728b"><rect x="50" y="100" width="290" height="100" rx="12"/><rect x="455" y="100" width="340" height="100" rx="12"/><rect x="910" y="100" width="240" height="100" rx="12"/></g><text x="195" y="140">Provider · pay_100</text><text x="195" y="174" font-size="18">signed raw bytes · evt_501</text><text x="625" y="140">Verify signature + timestamp</text><text x="625" y="174" font-size="18">trusted merchant / account mapping</text><text x="1030" y="140">Invalid → reject</text><text x="1030" y="174" font-size="18">no state mutation</text><rect x="140" y="250" width="920" height="195" rx="14" fill="#103d35" stroke="#7cddbf"/><text x="600" y="288" fill="#9ce8cd">ONE POSTGRESQL TRANSACTION</text><text x="320" y="345">Inbox uniqueness</text><text x="600" y="345">Payment state guard</text><text x="875" y="345">Outbox intent</text><text x="320" y="380" font-size="18">deduplicate input</text><text x="600" y="380" font-size="18">PENDING → SUCCEEDED once</text><text x="875" y="380" font-size="18">commit follow-up work</text><text x="600" y="420" font-size="18">Commit first. Then return 2xx. No external API calls inside this transaction.</text><g fill="#17364b" stroke="#54728b"><rect x="80" y="520" width="300" height="105" rx="12"/><rect x="450" y="520" width="300" height="105" rx="12"/><rect x="820" y="520" width="300" height="105" rx="12"/></g><text x="230" y="560">Retryable dispatcher</text><text x="230" y="595" font-size="18">stable business keys</text><text x="600" y="560">Email endpoint</text><text x="600" y="595" font-size="18">deduplicate email key</text><text x="970" y="560">Fulfillment endpoint</text><text x="970" y="595" font-size="18">deduplicate shipment key</text><text x="600" y="682" font-size="20" fill="#efcf84">Outbox preserves intent. Destination idempotency or reconciliation handles ambiguous sends.</text></g></g><g stroke="#8cddd0" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M340 150H450"/><path d="M795 150H905"/><path d="M625 200V245"/><path d="M230 445V515"/><path d="M380 573H445"/><path d="M230 625V650H970V630"/></g></svg>
