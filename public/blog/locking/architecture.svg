<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="#08251a"/><g font-family="Arial" fill="#f5f1e7" text-anchor="middle" font-size="23"><text x="500" y="42" fill="#e7c779">Simplified inventory architecture · illustrative, not a deployed system</text><rect x="50" y="80" width="260" height="65" rx="12" fill="#173e2b" stroke="#e7c779"/><text x="180" y="120">Shopper A / ATG</text><rect x="690" y="80" width="260" height="65" rx="12" fill="#173e2b" stroke="#e7c779"/><text x="820" y="120">Shopper B / ATG</text><path d="M180 145V180H500 M820 145V180H500V210" stroke="#e7c779" fill="none"/><rect x="270" y="210" width="460" height="65" rx="12" fill="#173e2b" stroke="#e7c779"/><text x="500" y="250">Spring Boot reservation API</text><path d="M500 275V310" stroke="#e7c779"/><rect x="120" y="310" width="760" height="95" rx="12" fill="#173e2b" stroke="#e7c779"/><text x="500" y="350">PostgreSQL: one atomic transaction</text><text x="500" y="385">Stock claim + reservation + request key + outbox event</text><path d="M500 405V440" stroke="#e7c779"/><text x="500" y="475">Outbox relay → OMS (after commit)</text><text x="500" y="515" font-size="19">With one unit: one reservation succeeds; the other gets sold out.</text></g></svg>
